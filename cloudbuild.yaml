steps:
# Step 1: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t',
    'us-central1-docker.pkg.dev/handson-493511/todo-repo/sample_cicd:$BUILD_ID',
    '.'
  ]

# Step 2: Push image
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'push',
    'us-central1-docker.pkg.dev/handson-493511/todo-repo/sample_cicd:$BUILD_ID'
  ]

# Step 3: Create Instance Template
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud compute instance-templates create-with-container sample-cicd-template-$BUILD_ID \
      --machine-type=e2-micro \
      --tags=sample-cicd-node \
      --container-image=us-central1-docker.pkg.dev/handson-493511/todo-repo/sample_cicd:$BUILD_ID \
      --boot-disk-size=10GB

# Step 4: Rolling Update (Zero-Downtime)
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'compute'
  - 'instance-groups'
  - 'managed'
  - 'rolling-action'
  - 'start-update'
  - 'sample-cicd-mig'
  - '--version=template=sample-cicd-template-$BUILD_ID'
  - '--zone=us-central1-a'
  - '--type=proactive'
  - '--max-unavailable=0'
  - '--max-surge=1'

# Step 5: Cleanup old templates (optional)
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    gcloud compute instance-templates list \
    --filter="name~'sample-cicd-template-'" \
    --sort-by=~creationTimestamp \
    --format="value(name)" | tail -n +6 | \
    xargs -r gcloud compute instance-templates delete -q

images:
- 'us-central1-docker.pkg.dev/handson-493511/todo-repo/sample_cicd:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
