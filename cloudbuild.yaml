steps:
# Step 1: Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  args: 
    [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/logging-demo-project-496803/sample_cicd/sample-app:$BUILD_ID',
      '.'
    ]

# Step 2: Push image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: 
    [
      'push',
      'us-central1-docker.pkg.dev/logging-demo-project-496803/sample_cicd/sample-app:$BUILD_ID'
    ]

# Step 3: Create new Instance Template with container
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud compute instance-templates create-with-container sample-app-template-$BUILD_ID \
        --machine-type=e2-micro \
        --tags=sample-app \
        --container-image=us-central1-docker.pkg.dev/logging-demo-project-496803/sample_cicd/sample-app:$BUILD_ID \
        --boot-disk-size=10GB

# Step 4: Rolling update to MIG (Zero downtime)
- name: 'gcr.io/cloud-builders/gcloud'
  args:
    - 'compute'
    - 'instance-groups'
    - 'managed'
    - 'rolling-action'
    - 'start-update'
    - 'sample-app-mig'
    - '--version=template=sample-app-template-$BUILD_ID'
    - '--zone=us-central1-a'

images:
- 'us-central1-docker.pkg.dev/logging-demo-project-496803/sample_cicd/sample-app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
